<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">PLANORA</h2>
                        <p class="text-muted small">Buat akun gratis kamu sekarang</p>
                    </div>
                    <form onsubmit="prosesRegister(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nama Lengkap</label>
                            <input type="text" id="reg-nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Alamat Email</label>
                            <input type="email" id="reg-email" class="form-control" placeholder="budi@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Kata Sandi</label>
                            <input type="password" class="form-control" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Daftar Sekarang</button>
                    </form>
                    <div class="text-center">
                        <span class="small text-muted">Sudah punya akun? <a href="login.html" class="text-decoration-none">Login</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function prosesRegister(e) {
            e.preventDefault();
            const userBaru = {
                nama: document.getElementById('reg-nama').value,
                email: document.getElementById('reg-email').value,
                telegram: ""
            };
            localStorage.setItem('planoraUser', JSON.stringify(userBaru));
            alert('Pendaftaran Berhasil! Silakan login.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
