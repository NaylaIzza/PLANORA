<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Profil - Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <a href="workspace.html" class="btn btn-link text-decoration-none text-secondary mb-3 p-0"><i class="fa-solid fa-arrow-left me-2"></i> Kembali ke Workspace</a>
                
                <div class="card shadow border-0 p-4 bg-white">
                    <div class="d-flex align-items-center mb-4">
                        <div class="p-3 bg-primary text-white rounded-3 me-3 fs-3"><i class="fa-solid fa-user-gear"></i></div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark">Pengaturan Profil</h4>
                            <p class="text-muted small mb-0">Ubah info data diri & sambungkan notifikasi</p>
                        </div>
                    </div>

                    <form onsubmit="updateProfil(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nama Pengguna</label>
                            <input type="text" id="p-nama" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Alamat Email</label>
                            <input type="email" id="p-email" class="form-control" required>
                        </div>

                        <div class="card border border-primary-light bg-light p-3 my-4">
                            <label class="form-label small fw-bold text-primary mb-1">
                                <i class="fa-brands fa-telegram fs-5 me-1 text-info"></i> Integrasi Notifikasi Telegram
                            </label>
                            <p class="text-muted mb-3" style="font-size:11px;">Dapatkan pemberitahuan otomatis ke HP-mu saat antrean tugas dikalkulasi.</p>
                            <input type="text" id="p-tele" class="form-control form-control-sm" placeholder="Contoh: @PlanoraNotifBot atau ID Chat">
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="workspace.html" class="btn btn-outline-secondary px-4">Batal</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Update Profil</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Ambil data user yang ada saat halaman dimuat
        window.onload = function() {
            const dataUser = JSON.parse(localStorage.getItem('planoraUser')) || { nama: "Mahasiswa Planora", email: "mahasiswa@planora.id", telegram: "" };
            document.getElementById('p-nama').value = dataUser.nama;
            document.getElementById('p-email').value = dataUser.email;
            document.getElementById('p-tele').value = dataUser.telegram || "";
        }

        function updateProfil(e) {
            e.preventDefault();
            const userUpdate = {
                nama: document.getElementById('p-nama').value,
                email: document.getElementById('p-email').value,
                telegram: document.getElementById('p-tele').value
            };

            localStorage.setItem('planoraUser', JSON.stringify(userUpdate));
            alert('Profil Anda berhasil diperbarui!');
            window.location.href = 'workspace.html'; // Kembalikan ke halaman workspace utama setelah berhasil
        }
    </script>
</body>
</html>
