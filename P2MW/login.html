<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">PLANORA</h2>
                        <p class="text-muted small">Silakan masuk ke akun workspace Anda</p>
                    </div>
                    <form onsubmit="prosesLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Alamat Email</label>
                            <input type="email" id="email" class="form-value form-control" value="mahasiswa@planora.id" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Kata Sandi</label>
                            <input type="password" class="form-control" value="123456" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Masuk Aplikasi</button>
                    </form>
                    <div class="text-center">
                        <span class="small text-muted">Belum punya akun? <a href="register.html" class="text-decoration-none">Daftar</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function prosesLogin(e) {
            e.preventDefault();
            // Mengambil email dinamis untuk disimpan sementara
            const emailInput = document.getElementById('email').value;
            let sessionUser = JSON.parse(localStorage.getItem('planoraUser')) || { nama: "Mahasiswa Planora", telegram: "" };
            sessionUser.email = emailInput;
            
            localStorage.setItem('planoraUser', JSON.stringify(sessionUser));
            window.location.href = 'workspace.html'; // Alihkan ke workspace catatan
        }
    </script>
</body>
</html>
