<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planora Workspace - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <header class="navbar navbar-white bg-white shadow-sm py-2 px-4 sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-primary" href="#">P <span class="text-dark fs-6 fw-normal">Planora Workspace</span></a>
            
            <div class="d-flex align-items-center">
                <a href="profil.html" class="d-flex align-items-center text-decoration-none text-dark me-4">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold me-2" id="avatar" style="width:40px; height:40px;">MP</div>
                    <div>
                        <h6 class="mb-0 small fw-bold" id="user-nama">Mahasiswa Planora</h6>
                        <small class="text-muted" style="font-size:11px;" id="user-email">mahasiswa@planora.id</small>
                    </div>
                </a>
                <a href="index.html" class="btn btn-outline-danger btn-sm fw-bold" onclick="localStorage.removeItem('planoraTasks');"><i class="fa-solid fa-sign-out-alt"></i> Keluar</a>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-top border-4 border-secondary bg-white">
                    <small class="text-muted text-uppercase fw-bold" style="font-size:11px;">Total Tugas</small>
                    <h3 class="fw-bold mt-1" id="c-total">0 <span class="fs-6 text-muted fw-normal">aktif</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-top border-4 border-danger" style="background:#fef2f2;">
                    <small class="text-danger text-uppercase fw-bold" style="font-size:11px;">🚨 Krusial</small>
                    <h3 class="fw-bold text-danger mt-1" id="c-krusial">0 <span class="fs-6 text-danger fw-normal">butuh aksi</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-top border-4 border-warning" style="background:#fffbeb;">
                    <small class="text-warning text-uppercase fw-bold" style="font-size:11px;">⏳ Sedang</small>
                    <h3 class="fw-bold text-warning mt-1" id="c-sedang">0 <span class="fs-6 text-warning fw-normal">antrean</span></h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 shadow-sm border-0 border-top border-4 border-success" style="background:#f0fdf4;">
                    <small class="text-success text-uppercase fw-bold" style="font-size:11px;">✅ Selesai</small>
                    <h3 class="fw-bold text-success mt-1" id="c-selesai">4 <span class="fs-6 text-success fw-normal">hari ini</span></h3>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0 bg-white">
                    <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-bookmark me-2"></i>Catat Tugas Baru</h5>
                    <form id="frm-tugas" onsubmit="tambahTugas(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Judul Tugas / Proyek</label>
                            <input type="text" id="t-judul" class="form-control text-muted" placeholder="Contoh: Laporan Akhir Praktikum" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mata Kuliah</label>
                            <input type="text" id="t-matkul" class="form-control text-muted" placeholder="Contoh: Pemrograman Web" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Batas Sisa Hari</label>
                                <select id="t-deadline" class="form-select small" required>
                                    <option value="Mendesak">Mendesak (< 2 Hari)</option>
                                    <option value="Sedang">Sedang (3-5 Hari)</option>
                                    <option value="Senggang">Senggang (> 5 Hari)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Tingkat Kesulitan</label>
                                <select id="t-kesulitan" class="form-select small" required>
                                    <option value="Tinggi">Tinggi (Kelompok)</option>
                                    <option value="Sedang">Sedang (Analisis)</option>
                                    <option value="Rendah">Rendah (Kuis)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Kalkulasi Antrean</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <h6 class="fw-bold tracking-wide text-secondary mb-3">URUTAN EKSEKUSI TERKALKULASI</h6>
                <div class="card shadow-sm border-0 p-4 bg-white" style="min-height: 335px;" id="box-antrean">
                    <div class="text-center text-muted my-auto" id="empty-state">
                        Belum ada tugas akademik yang dicatat hari ini.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let listTugas = JSON.parse(localStorage.getItem('planoraTasks')) || [];
        let totalSelesai = parseInt(localStorage.getItem('planoraDoneCount')) || 4;

        window.onload = function() {
            // Sinkronisasi data user aktif
            const dataUser = JSON.parse(localStorage.getItem('planoraUser')) || { nama: "Mahasiswa Planora", email: "mahasiswa@planora.id" };
            document.getElementById('user-nama').innerText = dataUser.nama;
            document.getElementById('user-email').innerText = dataUser.email;
            document.getElementById('avatar').innerText = dataUser.nama.substring(0,2).toUpperCase();
            
            renderTugas();
        }

        function tambahTugas(e) {
            e.preventDefault();
            const judul = document.getElementById('t-judul').value;
            const matkul = document.getElementById('t-matkul').value;
            const deadline = document.getElementById('t-deadline').value;
            const kesulitan = document.getElementById('t-kesulitan').value;

            let prioritas = "SEDANG", warna = "warning", bg = "#fffbeb";
            if (deadline === "Mendesak" || (deadline === "Sedang" && kesulitan === "Tinggi")) {
                prioritas = "KRUSIAL"; warna = "danger"; bg = "#fef2f2";
            } else if (deadline === "Senggang" && kesulitan === "Rendah") {
                prioritas = "NORMAL"; warna = "success"; bg = "#f0fdf4";
            }

            const tugas = { id: Date.now(), judul, matkul, deadline, kesulitan, prioritas, warna, bg };
            
            if(prioritas === "KRUSIAL") listTugas.unshift(tugas);
            else listTugas.push(tugas);

            localStorage.setItem('planoraTasks', JSON.stringify(listTugas));
            document.getElementById('frm-tugas').reset();
            renderTugas();
        }

        function selesaikanTugas(id) {
            listTugas = listTugas.filter(t => t.id !== id);
            totalSelesai++;
            localStorage.setItem('planoraTasks', JSON.stringify(listTugas));
            localStorage.setItem('planoraDoneCount', totalSelesai);
            renderTugas();
        }

        function renderTugas() {
            const box = document.getElementById('box-antrean');
            if(listTugas.length === 0) {
                box.innerHTML = `<div class="text-center text-muted my-auto">Belum ada tugas akademik yang dicatat hari ini.</div>`;
                updateCounters(0, 0, 0);
                return;
            }

            box.innerHTML = "";
            listTugas.forEach(t => {
                box.innerHTML += `
                    <div class="alert alert-${t.warna} d-flex justify-content-between align-items-center border-start border-5 border-${t.warna} mb-3">
                        <div>
                            <strong class="d-block">${t.judul} <span class="badge bg-light text-dark ms-2 fw-normal">${t.matkul}</span></strong>
                            <small class="text-muted">Sisa: ${t.deadline} | Kompleksitas: ${t.kesulitan}</small>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge bg-${t.warna} text-uppercase">${t.prioritas}</span>
                            <button onclick="selesaikanTugas(${t.id})" class="btn text-success border-0 p-0 fs-4" title="Selesai dan Hapus"><i class="fa-solid fa-circle-check"></i></button>
                        </div>
                    </div>`;
            });

            const k = listTugas.filter(t => t.prioritas === "KRUSIAL").length;
            const s = listTugas.filter(t => t.prioritas === "SEDANG").length;
            updateCounters(listTugas.length, k, s);
        }

        function updateCounters(total, krusial, sedang) {
            document.getElementById('c-total').innerHTML = `${total} <span class="fs-6 text-muted fw-normal">aktif</span>`;
            document.getElementById('c-krusial').innerHTML = `${krusial} <span class="fs-6 text-danger fw-normal">butuh aksi</span>`;
            document.getElementById('c-sedang').innerHTML = `${sedang} <span class="fs-6 text-warning fw-normal">antrean</span>`;
            document.getElementById('c-selesai').innerHTML = `${totalSelesai} <span class="fs-6 text-success fw-normal">hari ini</span>`;
        }
    </script>
</body>
</html>
