<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card p-4 bg-white">
                <div class="text-center mb-4">
                    <img src="../assets/img/Lg.png" alt="Planora" height="40" class="mb-3">
                    <h4 class="fw-bold text-primary mb-1">Masuk ke Planora</h4>
                    <p class="text-muted small">Silakan masuk ke akun workspace Anda</p>
                </div>
                <div id="alert-box"></div>
                <form onsubmit="prosesLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Alamat Email</label>
                        <input type="email" id="email" class="form-control" placeholder="email@contoh.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kata Sandi</label>
                        <input type="password" id="password" class="form-control" placeholder="Min. 6 karakter" required>
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary w-100 fw-bold py-2 mb-3">
                        Masuk Aplikasi
                    </button>
                </form>
                <div class="text-center">
                    <span class="small text-muted">Belum punya akun?
                        <a href="register.html" class="text-decoration-none fw-semibold">Daftar</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
    async function prosesLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.textContent = 'Memproses...';

        try {
            const data = await apiFetch('auth.php?action=login', {
                method: 'POST',
                body: JSON.stringify({
                    email   : document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            if (data.status === 'success') {
                Auth.setUser(data.user);
                window.location.href = 'workspace.html';
            } else {
                showAlert('alert-box', data.message);
                btn.disabled = false;
                btn.textContent = 'Masuk Aplikasi';
            }
        } catch (err) {
            showAlert('alert-box', 'Tidak bisa terhubung ke server. Pastikan XAMPP aktif.');
            btn.disabled = false;
            btn.textContent = 'Masuk Aplikasi';
        }
    }
</script>
</body>
</html>
