<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace — Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<header class="navbar-planora py-2 px-4 sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <img src="../assets/img/Lg.png" alt="Planora" height="32">
            <span class="fw-bold text-primary fs-5">Planora</span>
            <span class="badge bg-primary-subtle text-primary fw-semibold ms-1">Workspace</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a href="profil.html" class="d-flex align-items-center text-decoration-none text-dark">
                <div class="avatar-circle bg-primary text-white me-2" id="avatar">MP</div>
                <div class="d-none d-sm-block">
                    <p class="mb-0 small fw-bold" id="user-nama">Mahasiswa Planora</p>
                    <small class="text-muted" id="user-email">mahasiswa@planora.id</small>
                </div>
            </a>
            <button onclick="Auth.logout()" class="btn btn-outline-danger btn-sm fw-bold">
                <i class="fa-solid fa-sign-out-alt me-1"></i>Keluar
            </button>
        </div>
    </div>
</header>

<main class="container my-4">
    <!-- Statistik -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 shadow-sm border-top border-4 border-secondary bg-white">
                <small class="text-muted text-uppercase fw-bold" style="font-size:11px;">Total Tugas</small>
                <h3 class="fw-bold mt-1" id="c-total">0 <span class="fs-6 text-muted fw-normal">aktif</span></h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 shadow-sm border-top border-4 border-danger" style="background:#fef2f2;">
                <small class="text-danger text-uppercase fw-bold" style="font-size:11px;">🚨 Krusial</small>
                <h3 class="fw-bold text-danger mt-1" id="c-krusial">0 <span class="fs-6 fw-normal">butuh aksi</span></h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 shadow-sm border-top border-4 border-warning" style="background:#fffbeb;">
                <small class="text-warning text-uppercase fw-bold" style="font-size:11px;">⏳ Sedang</small>
                <h3 class="fw-bold text-warning mt-1" id="c-sedang">0 <span class="fs-6 fw-normal">antrean</span></h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card stat-card p-3 shadow-sm border-top border-4 border-success" style="background:#f0fdf4;">
                <small class="text-success text-uppercase fw-bold" style="font-size:11px;">✅ Selesai</small>
                <h3 class="fw-bold text-success mt-1" id="c-selesai">0 <span class="fs-6 fw-normal">total</span></h3>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Form Tambah -->
        <div class="col-lg-4">
            <div class="card p-4 shadow-sm border-0 bg-white">
                <h5 class="fw-bold text-primary mb-3">
                    <i class="fa-solid fa-bookmark me-2"></i>Catat Tugas Baru
                </h5>
                <form id="frm-tugas" onsubmit="tambahTugas(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Judul Tugas / Proyek</label>
                        <input type="text" id="t-judul" class="form-control"
                               placeholder="Contoh: Laporan Akhir Praktikum" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mata Kuliah</label>
                        <input type="text" id="t-matkul" class="form-control"
                               placeholder="Contoh: Pemrograman Web" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Sisa Hari</label>
                            <select id="t-deadline" class="form-select form-select-sm" required>
                                <option value="Mendesak">Mendesak (&lt; 2 Hari)</option>
                                <option value="Sedang">Sedang (3–5 Hari)</option>
                                <option value="Senggang">Senggang (&gt; 5 Hari)</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Kesulitan</label>
                            <select id="t-kesulitan" class="form-select form-select-sm" required>
                                <option value="Tinggi">Tinggi (Kelompok)</option>
                                <option value="Sedang">Sedang (Analisis)</option>
                                <option value="Rendah">Rendah (Kuis)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="btn-tambah" class="btn btn-primary w-100 fw-bold py-2">
                        <i class="fa-solid fa-calculator me-1"></i>Kalkulasi Antrean
                    </button>
                </form>
            </div>
        </div>

        <!-- Daftar Tugas -->
        <div class="col-lg-8">
            <h6 class="fw-bold text-secondary mb-3 text-uppercase tracking-wide">Urutan Eksekusi Terkalkulasi</h6>
            <div class="card shadow-sm border-0 p-4 bg-white" style="min-height:335px;" id="box-antrean">
                <div class="text-center text-muted py-5" id="empty-state">
                    <i class="fa-solid fa-inbox fa-2x mb-2 opacity-25"></i>
                    <p class="mb-0">Memuat data tugas...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="../assets/js/app.js"></script>
<script>
    let currentUser = null;

    window.onload = async function () {
        if (!Auth.requireLogin()) return;
        currentUser = Auth.getUser();

        document.getElementById('user-nama').textContent  = currentUser.nama;
        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('avatar').textContent     = currentUser.nama.substring(0, 2).toUpperCase();

        await loadTugas();
    };

    async function loadTugas() {
        try {
            const data = await apiFetch(`tasks.php?action=list&user_id=${currentUser.id}`);
            if (data.status === 'success') {
                renderTugas(data.tugas, data.total_selesai);
            }
        } catch (e) {
            document.getElementById('box-antrean').innerHTML =
                '<div class="alert alert-danger small m-0">Gagal terhubung ke server. Pastikan XAMPP aktif.</div>';
        }
    }

    async function tambahTugas(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-tambah');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Menyimpan...';

        try {
            const data = await apiFetch('tasks.php?action=tambah', {
                method: 'POST',
                body: JSON.stringify({
                    user_id   : currentUser.id,
                    judul     : document.getElementById('t-judul').value,
                    matkul    : document.getElementById('t-matkul').value,
                    deadline  : document.getElementById('t-deadline').value,
                    kesulitan : document.getElementById('t-kesulitan').value
                })
            });

            if (data.status === 'success') {
                document.getElementById('frm-tugas').reset();
                await loadTugas();
            } else {
                alert(data.message);
            }
        } catch (e) {
            alert('Gagal terhubung ke server.');
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-calculator me-1"></i>Kalkulasi Antrean';
    }

    async function selesaikanTugas(id) {
        try {
            const data = await apiFetch('tasks.php?action=selesai', {
                method: 'POST',
                body: JSON.stringify({ id, user_id: currentUser.id })
            });
            if (data.status === 'success') await loadTugas();
        } catch (e) {
            alert('Gagal menghubungi server.');
        }
    }

    function renderTugas(listTugas, totalSelesai) {
        const box = document.getElementById('box-antrean');

        if (!listTugas || listTugas.length === 0) {
            box.innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="fa-solid fa-circle-check fa-2x mb-2 text-success opacity-50"></i>
                    <p class="mb-0">Belum ada tugas aktif. Tambahkan tugas baru!</p>
                </div>`;
            updateCounters(0, 0, 0, totalSelesai);
            return;
        }

        box.innerHTML = listTugas.map(t => `
            <div class="alert alert-${t.warna} task-item d-flex justify-content-between align-items-center border-start border-5 border-${t.warna} mb-3">
                <div>
                    <strong class="d-block">${t.judul}
                        <span class="badge bg-light text-dark ms-2 fw-normal">${t.matkul}</span>
                    </strong>
                    <small class="text-muted">Sisa: ${t.deadline} &nbsp;|&nbsp; Kompleksitas: ${t.kesulitan}</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-${t.warna} text-uppercase">${t.prioritas}</span>
                    <button onclick="selesaikanTugas(${t.id})"
                        class="btn text-success border-0 p-0 fs-4" title="Tandai Selesai">
                        <i class="fa-solid fa-circle-check"></i>
                    </button>
                </div>
            </div>`).join('');

        const k = listTugas.filter(t => t.prioritas === 'KRUSIAL').length;
        const s = listTugas.filter(t => t.prioritas === 'SEDANG').length;
        updateCounters(listTugas.length, k, s, totalSelesai);
    }

    function updateCounters(total, krusial, sedang, selesai) {
        document.getElementById('c-total').innerHTML   = `${total} <span class="fs-6 text-muted fw-normal">aktif</span>`;
        document.getElementById('c-krusial').innerHTML = `${krusial} <span class="fs-6 fw-normal">butuh aksi</span>`;
        document.getElementById('c-sedang').innerHTML  = `${sedang} <span class="fs-6 fw-normal">antrean</span>`;
        document.getElementById('c-selesai').innerHTML = `${selesai} <span class="fs-6 fw-normal">total</span>`;
    }
</script>
</body>
</html>
