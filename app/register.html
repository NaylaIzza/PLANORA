<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun — Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card p-4 bg-white">
                <div class="text-center mb-4">
                    <img src="../assets/img/Lg.png" alt="Planora" height="40" class="mb-3">
                    <h4 class="fw-bold text-primary mb-1">Buat Akun Gratis</h4>
                    <p class="text-muted small">Mulai atur tugasmu sekarang</p>
                </div>
                <div id="alert-box"></div>
                <form onsubmit="prosesRegister(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nama Lengkap</label>
                        <input type="text" id="reg-nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Alamat Email</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="budi@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kata Sandi</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 karakter" required>
                    </div>
                    <button type="submit" id="btn-daftar" class="btn btn-primary w-100 fw-bold py-2 mb-3">
                        Daftar Sekarang
                    </button>
                </form>
                <div class="text-center">
                    <span class="small text-muted">Sudah punya akun?
                        <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
    async function prosesRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-daftar');
        btn.disabled = true;
        btn.textContent = 'Mendaftarkan...';

        const password = document.getElementById('reg-password').value;
        if (password.length < 6) {
            showAlert('alert-box', 'Password minimal 6 karakter.');
            btn.disabled = false;
            btn.textContent = 'Daftar Sekarang';
            return;
        }

        try {
            const data = await apiFetch('auth.php?action=register', {
                method: 'POST',
                body: JSON.stringify({
                    nama    : document.getElementById('reg-nama').value,
                    email   : document.getElementById('reg-email').value,
                    password: password
                })
            });

            if (data.status === 'success') {
                showAlert('alert-box', data.message + ' Mengalihkan ke login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showAlert('alert-box', data.message);
                btn.disabled = false;
                btn.textContent = 'Daftar Sekarang';
            }
        } catch (err) {
            showAlert('alert-box', 'Tidak bisa terhubung ke server. Pastikan XAMPP aktif.');
            btn.disabled = false;
            btn.textContent = 'Daftar Sekarang';
        }
    }
</script>
</body>
</html>
