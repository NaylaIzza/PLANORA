<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Profil — Planora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <a href="workspace.html" class="btn btn-link text-decoration-none text-secondary mb-3 p-0">
                <i class="fa-solid fa-arrow-left me-2"></i>Kembali ke Workspace
            </a>
            <div class="card auth-card p-4 bg-white">
                <div class="d-flex align-items-center mb-4">
                    <div class="p-3 bg-primary text-white rounded-3 me-3 fs-3">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Pengaturan Profil</h4>
                        <p class="text-muted small mb-0">Ubah info data diri & notifikasi Telegram</p>
                    </div>
                </div>

                <div id="alert-box"></div>

                <form onsubmit="updateProfil(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nama Pengguna</label>
                        <input type="text" id="p-nama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Alamat Email</label>
                        <input type="email" id="p-email" class="form-control" required>
                    </div>
                    <div class="card border border-primary-subtle bg-light p-3 my-3">
                        <label class="form-label small fw-bold text-primary mb-1">
                            <i class="fa-brands fa-telegram fs-5 me-1 text-info"></i>Integrasi Notifikasi Telegram
                        </label>
                        <p class="text-muted mb-2" style="font-size:11px;">
                            Dapatkan pemberitahuan otomatis ke HP-mu saat antrean tugas dikalkulasi.
                        </p>
                        <input type="text" id="p-tele" class="form-control form-control-sm"
                               placeholder="Contoh: @PlanoraNotifBot atau Chat ID">
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="workspace.html" class="btn btn-outline-secondary px-4">Batal</a>
                        <button type="submit" id="btn-update" class="btn btn-primary px-4 fw-bold">
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
    let currentUser = null;

    window.onload = function () {
        if (!Auth.requireLogin()) return;
        currentUser = Auth.getUser();

        document.getElementById('p-nama').value  = currentUser.nama;
        document.getElementById('p-email').value = currentUser.email;
        document.getElementById('p-tele').value  = currentUser.telegram_id || '';
    };

    async function updateProfil(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-update');
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';

        try {
            const data = await apiFetch('user.php', {
                method: 'POST',
                body: JSON.stringify({
                    user_id    : currentUser.id,
                    nama       : document.getElementById('p-nama').value,
                    email      : document.getElementById('p-email').value,
                    telegram_id: document.getElementById('p-tele').value
                })
            });

            if (data.status === 'success') {
                Auth.setUser(data.user);
                showAlert('alert-box', 'Profil berhasil diperbarui! Mengalihkan...', 'success');
                setTimeout(() => window.location.href = 'workspace.html', 1200);
            } else {
                showAlert('alert-box', data.message);
                btn.disabled = false;
                btn.textContent = 'Simpan Perubahan';
            }
        } catch (err) {
            showAlert('alert-box', 'Tidak bisa terhubung ke server. Pastikan XAMPP aktif.');
            btn.disabled = false;
            btn.textContent = 'Simpan Perubahan';
        }
    }
</script>
</body>
</html>
